AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Personal Pollution Optimizer - AWS-native whole-day environmental exposure optimizer

Parameters:
  DemoMode:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  BedrockModelId:
    Type: String
    Default: ''
  TomorrowIoApiKey:
    Type: String
    Default: ''
    NoEcho: true
  MapAllowedReferer:
    Type: String
    Default: 'http://localhost:5173/*'
    Description: Browser referer allowed to use the public map-only Amazon Location API key. Use the Amplify domain in production.
  AppTimezoneOffset:
    Type: String
    Default: '+05:30'
    AllowedPattern: '^(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$'

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref PlansTable
        DEMO_MODE: !Ref DemoMode
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        APP_TIMEZONE_OFFSET: !Ref AppTimezoneOffset
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"

Resources:
  LiveMapApiKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: !Sub '${AWS::StackName}-web-map'
      Description: Public browser key restricted to Amazon Location Maps V2 rendering
      NoExpiry: true
      ForceDelete: true
      ForceUpdate: true
      Restrictions:
        AllowActions:
          - geo-maps:*
        AllowResources:
          - !Sub 'arn:${AWS::Partition}:geo-maps:${AWS::Region}::provider/default'
        AllowReferers:
            - !Ref MapAllowedReferer
            - 'http://localhost:5173/*'
            - 'http://127.0.0.1:5173/*'
            - 'http://localhost:4173/*'
            - 'http://127.0.0.1:4173/*'

  PlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  WorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  PrepareFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/prepare.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/prepare.handler

  OptimizeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/optimize.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/optimize.handler
      Timeout: 90
      MemorySize: 768
      Environment:
        Variables:
          TOMORROW_IO_API_KEY: !Ref TomorrowIoApiKey
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - geo-routes:CalculateRoutes
                - geo-places:Geocode
              Resource: '*'

  PersistFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/persist.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/persist.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlansTable

  OptimizationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: EXPRESS
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt WorkflowLogGroup.Arn
        IncludeExecutionData: false
        Level: ERROR
      Definition:
        StartAt: Prepare
        States:
          Prepare:
            Type: Task
            Resource: !GetAtt PrepareFunction.Arn
            Next: Optimize
          Optimize:
            Type: Task
            Resource: !GetAtt OptimizeFunction.Arn
            Next: Persist
          Persist:
            Type: Task
            Resource: !GetAtt PersistFunction.Arn
            End: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PrepareFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref OptimizeFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref PersistFunction
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogDelivery
                - logs:GetLogDelivery
                - logs:UpdateLogDelivery
                - logs:DeleteLogDelivery
                - logs:ListLogDeliveries
                - logs:PutResourcePolicy
                - logs:DescribeResourcePolicies
                - logs:DescribeLogGroups
              Resource: '*'

  AnalyzeApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/analyze-api.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/analyze-api.handler
      Timeout: 90
      Environment:
        Variables:
          WORKFLOW_ARN: !Ref OptimizationStateMachine
      Policies:
        - Statement:
            - Effect: Allow
              Action: states:StartSyncExecution
              Resource: !Ref OptimizationStateMachine
      Events:
        Analyze:
          Type: Api
          Properties:
            Path: /api/day/analyze
            Method: post

  IcsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/ics.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/ics.handler
      Events:
        ImportIcs:
          Type: Api
          Properties:
            Path: /api/ics/parse
            Method: post

  DemoFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/demo.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/demo.handler
      Events:
        Demo:
          Type: Api
          Properties:
            Path: /api/demo/day
            Method: get

  AcceptFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/accept.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/accept.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlansTable
      Events:
        Accept:
          Type: Api
          Properties:
            Path: /api/plan/accept
            Method: post

  HistoryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/history.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/history.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlansTable
      Events:
        History:
          Type: Api
          Properties:
            Path: /api/history
            Method: get

  ImpactFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/impact.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/impact.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlansTable
      Events:
        CommunityImpact:
          Type: Api
          Properties:
            Path: /api/impact/community
            Method: get

  IndiaFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/india.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/india.handler
      Timeout: 30
      Environment:
        Variables:
          TOMORROW_IO_API_KEY: !Ref TomorrowIoApiKey
      Events:
        India:
          Type: Api
          Properties:
            Path: /api/india
            Method: get

  ResolvePlaceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/resolve-place.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/resolve-place.handler
      Timeout: 12
      Policies:
        - Statement:
            - Effect: Allow
              Action: geo-places:Geocode
              Resource: '*'
      Events:
        ResolvePlace:
          Type: Api
          Properties:
            Path: /api/places/resolve
            Method: post

  EnvironmentCurrentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/environment-current.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/environment-current.handler
      Timeout: 15
      Environment:
        Variables:
          TOMORROW_IO_API_KEY: !Ref TomorrowIoApiKey
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - geo-places:Geocode
              Resource: '*'
      Events:
        CurrentEnvironment:
          Type: Api
          Properties:
            Path: /api/environment/current
            Method: post

  RuntimeConfigFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/runtime-config.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/runtime-config.handler
      Timeout: 10
      Environment:
        Variables:
          MAP_API_KEY_NAME: !Ref LiveMapApiKey
          AMAZON_LOCATION_MAP_STYLE: Standard
      Policies:
        - Statement:
            - Effect: Allow
              Action: geo:DescribeKey
              Resource: !GetAtt LiveMapApiKey.Arn
      Events:
        RuntimeConfig:
          Type: Api
          Properties:
            Path: /api/runtime-config
            Method: get

  ExplainFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handlers/explain.ts]
        Minify: true
        Target: es2022
        Sourcemap: false
    Properties:
      CodeUri: backend/
      Handler: src/handlers/explain.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PlansTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
      Events:
        Explain:
          Type: Api
          Properties:
            Path: /api/explain
            Method: post


  # Native AWS operational signals: see failures and slow executions without
  # logging users' full private agenda or GPS route payloads to CloudWatch.
  AnalyzeApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Analysis Lambda is failing; investigate API Gateway and workflow logs.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyzeApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  OptimizeLambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Route optimizer Lambda is failing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref OptimizeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  WorkflowFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: AWS Step Functions optimization workflows failed.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref OptimizationStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AnalyzeLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: p95 analysis API duration above 25 seconds risks the REST API Gateway timeout.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyzeApiFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: 25000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  HackathonObservabilityDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-environmental-health'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Analysis API latency (p95) vs 29-second gateway limit",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${AnalyzeApiFunction}", {"stat": "p95", "label": "Analysis p95 (ms)"}]
                ],
                "annotations": {"horizontal": [{"label": "Gateway risk", "value": 29000}]}
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Step Functions execution outcomes",
                "region": "${AWS::Region}", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/States", "ExecutionsSucceeded", "StateMachineArn", "${OptimizationStateMachine}", {"stat": "Sum"}],
                  [".", "ExecutionsFailed", ".", ".", {"stat": "Sum"}],
                  [".", "ExecutionsTimedOut", ".", ".", {"stat": "Sum"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API and optimizer Lambda errors",
                "region": "${AWS::Region}", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${AnalyzeApiFunction}", {"stat": "Sum"}],
                  [".", "Errors", ".", "${OptimizeFunction}", {"stat": "Sum"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Accepted plan persistence and read capacity",
                "region": "${AWS::Region}", "period": 300, "view": "timeSeries",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${PlansTable}", {"stat": "Sum"}],
                  [".", "ConsumedReadCapacityUnits", ".", ".", {"stat": "Sum"}]
                ]
              }
            }
          ]
        }

Outputs:
  ApiEndpoint:
    Description: API Gateway base URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  LiveMapApiKeyName:
    Description: Amazon Location browser map key name. The frontend discovers its public value automatically through /api/runtime-config.
    Value: !Ref LiveMapApiKey
  StateMachineArn:
    Description: Optimization workflow ARN
    Value: !Ref OptimizationStateMachine
  ObservabilityDashboardName:
    Description: CloudWatch dashboard for analysis latency, workflow failures and DynamoDB persistence
    Value: !Ref HackathonObservabilityDashboard

