<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">Antelligence architecture: from a fixed calendar to a lower-modeled-exposure day</title>
<desc id="desc">React planner on AWS Amplify calls API Gateway and Lambda. A Step Functions Express workflow prepares and validates input, optimizes real routes from Amazon Location against Tomorrow.io or Open-Meteo forecasts with a deterministic exposure model, and persists the result in DynamoDB. Optional Bedrock explains the results. CloudWatch monitors operations. Journey map tiles are from OpenStreetMap.</desc>
