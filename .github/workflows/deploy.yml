name: CI/CD Pipeline
on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install esbuild
        run: npm install -g esbuild
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: SAM Build
        run: sam build
      - name: SAM Deploy
        run: |
          sam deploy --stack-name pollution-backend \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --parameter-overrides DemoMode=false MapAllowedReferer="https://main.d22y9q2ay7ukew.amplifyapp.com/*" \
            --no-confirm-changeset --no-fail-on-empty-changeset

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Install dependencies
        run: cd frontend && yarn install
      - name: Build frontend
        run: |
          cd frontend
          yarn build
        env:
          VITE_API_BASE_URL: "https://f5vtqmx8ne.execute-api.us-east-1.amazonaws.com/Prod"
          VITE_AWS_REGION: "us-east-1"
          VITE_AMAZON_LOCATION_MAP_STYLE: "Standard"
      - name: Deploy to Amplify
        run: |
          cd frontend/dist
          zip -r ../deploy.zip .
          cd ..
          DEPLOYMENT_INFO=$(aws amplify create-deployment --app-id d22y9q2ay7ukew --branch-name main)
          JOB_ID=$(echo $DEPLOYMENT_INFO | jq -r .jobId)
          UPLOAD_URL=$(echo $DEPLOYMENT_INFO | jq -r .zipUploadUrl)
          curl --fail --silent --show-error -T deploy.zip "$UPLOAD_URL"
          aws amplify start-deployment --app-id d22y9q2ay7ukew --branch-name main --job-id $JOB_ID
          STATUS=""
          for attempt in $(seq 1 60); do
            STATUS="$(aws amplify get-job --app-id d22y9q2ay7ukew --branch-name main --job-id "$JOB_ID" --query 'job.summary.status' --output text)"
            case "$STATUS" in
              SUCCEED) echo "Amplify deployment completed successfully"; break ;;
              FAILED|CANCELLED) echo "Amplify deployment failed: $STATUS" >&2; exit 1 ;;
            esac
            sleep 10
          done
          if [ "$STATUS" != "SUCCEED" ]; then echo "Amplify deployment did not complete in 10 minutes" >&2; exit 1; fi

      - name: Verify real AWS analysis, DynamoDB history and isolated guest sessions
        timeout-minutes: 4
        env:
          SMOKE_API_BASE_URL: "https://f5vtqmx8ne.execute-api.us-east-1.amazonaws.com/Prod"
        run: node scripts/production-smoke.mjs

