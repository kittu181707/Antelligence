name: ci
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: aws-actions/setup-sam@v2

      - name: Deployment script syntax
        run: bash -n scripts/deploy-aws.sh

      - name: Backend
        run: |
          cd backend
          npm install
          npm audit --audit-level=high
          npm run typecheck
          npm test

      - name: Local API smoke
        run: |
          cd backend
          npm run dev > /tmp/pollution-optimizer-backend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let demo;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              const response = await fetch('http://127.0.0.1:3001/api/demo/day');
              if (response.ok) { demo = await response.json(); break; }
            } catch {}
            await sleep(250);
          }
          if (!demo) throw new Error('local backend did not start');

          const runtime = await fetch('http://127.0.0.1:3001/api/runtime-config');
          if (!runtime.ok) throw new Error('runtime config endpoint failed');
          const runtimeJson = await runtime.json();
          if (!runtimeJson.region || runtimeJson.mapApiKey !== null) throw new Error('local runtime config contract changed');

          const invalidEnvironment = await fetch('http://127.0.0.1:3001/api/environment/current', {
            method:'POST',
            headers:{'content-type':'application/json'},
            body:JSON.stringify({position:{lat:120,lon:77}})
          });
          if (invalidEnvironment.status !== 400) throw new Error('invalid environment coordinates were not rejected');

          const crypto = await import('node:crypto');
          const token = 'cd'.repeat(32);
          const userId = 'user-' + crypto.createHash('sha256').update(token).digest('hex').slice(0,32);
          const headers = {'content-type':'application/json',authorization:'Bearer '+token};
          const payload = {
            userId, date:demo.date, homeLocation:demo.homeLocation,
            events:[demo.events[0]], maxExtraMinutes:10, demoMode:true,
            journeys:[{tripId:'first-trip',origin:demo.homeLocation,destination:demo.events[0].location,departureTime:'07:45',arriveBy:demo.events[0].start,mode:'car'}]
          };
          const unauthorized = await fetch('http://127.0.0.1:3001/api/day/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
          if(unauthorized.status!==401)throw new Error('analysis accepted missing private session');
          const analysisResponse = await fetch('http://127.0.0.1:3001/api/day/analyze',{method:'POST',headers,body:JSON.stringify(payload)});
          if(!analysisResponse.ok)throw new Error('local analysis failed: '+await analysisResponse.text());
          const analysis = await analysisResponse.json();
          if(analysis.workflow.dataMode!=='demo')throw new Error('controlled demo was misclassified');
          const savedBody = JSON.stringify({userId,planId:analysis.planId});
          const accepted = await fetch('http://127.0.0.1:3001/api/plan/accept',{method:'POST',headers,body:savedBody});
          if(!accepted.ok)throw new Error('plan accept failed: '+await accepted.text());
          const second = await fetch('http://127.0.0.1:3001/api/plan/accept',{method:'POST',headers,body:savedBody});
          if(!second.ok)throw new Error('repeat acceptance failed');
          const wrong = await fetch('http://127.0.0.1:3001/api/history?userId=someone-else',{headers});
          if(wrong.status!==403)throw new Error('session could view another user history');
          const historyResponse = await fetch('http://127.0.0.1:3001/api/history?userId='+userId,{headers});
          if(!historyResponse.ok)throw new Error('session history failed');
          const history = await historyResponse.json();
          if(history.plans.length!==1)throw new Error('repeat acceptance duplicated history');
          const impact = await (await fetch('http://127.0.0.1:3001/api/impact/community')).json();
          if(impact.totalPlans!==0)throw new Error('demo inflated real impact');
          console.log('session isolation, demo classification and idempotent plan smoke passed');
          console.log('local API demo + runtime-config + live-environment guard smoke passed');
          NODE

      - name: AWS SAM deployability
        run: |
          npm install --global esbuild@0.24.2
          sam validate
          sam build --parallel
          test -n "$(find .aws-sam/build -type f -name '*.js' -print -quit)"

      - name: Frontend
        run: |
          cd frontend
          npm install
          npm audit --audit-level=high
          npm run test:ui
          npm run typecheck
          npm run build

      - name: Chromium browser regression smoke
        run: |
          cd frontend
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/pollution-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/browser-smoke.mjs

      - name: Preserve browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pollution-browser-smoke
          path: |
            /tmp/pollution-landing-desktop.png
            /tmp/pollution-landing-tablet.png
            /tmp/pollution-landing-mobile.png
            /tmp/pollution-home-desktop.png
            /tmp/pollution-demo-desktop.png
            /tmp/pollution-home-mobile.png
          if-no-files-found: ignore
